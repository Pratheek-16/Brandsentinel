{
  "version": "3.9",
  "services": {
    "backend": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile"
      },
      "ports": ["8000:8000"],
      "environment": ["DATABASE_URL=postgresql+psycopg2://postgres:postgres@postgres:5432/brandsentinel"],
      "depends_on": ["postgres"]
    },
    "postgres": {
      "image": "pgvector/pgvector:pg16",
      "restart": "always",
      "environment": {
        "POSTGRES_USER": "postgres",
        "POSTGRES_PASSWORD": "postgres",
        "POSTGRES_DB": "brandsentinel"
      },
      "ports": ["5432:5432"],
      "volumes": ["postgres_data:/var/lib/postgresql/data"]
    }
  },
  "volumes": {
    "postgres_data": {}
  },
  "profiles": {
    "postgres": ["postgres"]
  }
}
